server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: the app uses react-router-dom's BrowserRouter, so a direct browser
        # request to a client-side route (e.g. /crawl-jobs/5) has to be served index.html
        # and resolved by the router, not 404'd by nginx for lacking a matching file.
        try_files $uri $uri/ /index.html;
    }
}
